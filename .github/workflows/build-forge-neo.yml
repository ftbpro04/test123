name: Build Forge Neo Anima
on:
  push:
    branches: [forge-neo-anima]
    paths: ['forge-neo/**', '.github/workflows/build-forge-neo.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: forge-neo
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ghcr.io/${{ github.repository_owner }}/vast-forge-neo:anima-v2
