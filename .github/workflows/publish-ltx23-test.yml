name: Publish tested LTX CUDA 13 candidate
on:
  push:
    branches: ['fix/ltx23-exact-workflow']
    paths: ['.github/workflows/publish-ltx23-test.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: ltx23-test-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/ftbpro04/vast-ltx23:cuda13-v4-heretic-20261014
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Free runner disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate from tested source
        uses: docker/build-push-action@v6
        with:
          context: ./ltx23
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/ftbpro04/test123
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container before publication
        run: bash ltx23/smoke_test.sh "$IMAGE"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only the versioned test tag
        run: |
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' | tee ltx23-test-results/published-digest.json
      - name: Verify anonymous registry access
        run: |
          python3 - <<'PY'
          import json, urllib.request
          repo='ftbpro04/vast-ltx23'
          with urllib.request.urlopen('https://ghcr.io/token?service=ghcr.io&scope=repository:'+repo+':pull',timeout=30) as r:
              token=json.load(r)['token']
          req=urllib.request.Request('https://ghcr.io/v2/'+repo+'/manifests/cuda13-v4-heretic-20261014',headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'})
          with urllib.request.urlopen(req,timeout=30) as r:
              print('Anonymous pull manifest verified:',r.headers.get('Docker-Content-Digest'))
          PY
      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltx23-published-candidate
          path: ltx23-test-results
