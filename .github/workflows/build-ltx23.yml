name: Validate LTX 2.3 CUDA 13 (no publication)
on:
  workflow_dispatch:
  push:
    paths:
      - 'ltx23/**'
      - '.github/workflows/build-ltx23.yml'
  pull_request:
    paths:
      - 'ltx23/**'
      - '.github/workflows/build-ltx23.yml'
permissions:
  contents: read
concurrency:
  group: ltx23-validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and process failure tests
        run: |
          python -m pip install requests psutil
          python -m unittest discover -s ltx23/tests -v
          python ltx23/check_build.py
          bash -n ltx23/entrypoint.sh ltx23/install_workflow_nodes.sh ltx23/smoke_test.sh
          python -m compileall -q ltx23
      - name: Free runner disk for CUDA image
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h
      - uses: docker/setup-buildx-action@v3
      - name: Build locally on runner; do not push
        uses: docker/build-push-action@v6
        with:
          context: ./ltx23
          load: true
          push: false
          tags: ltx23:cuda13-review
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Dashboard, Jupyter, crash survival, and CPU node registration
        run: bash ltx23/smoke_test.sh ltx23:cuda13-review
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltx23-validation-${{ github.sha }}
          path: ltx23-test-results
          if-no-files-found: ignore
