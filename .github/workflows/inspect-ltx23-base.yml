name: Inspect LTX23 base image
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-ltx23-base.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Pull base image
        run: docker pull antilopax/ltx23:v14

      - name: Show Docker image configuration
        run: |
          echo "=== docker inspect config ==="
          docker image inspect antilopax/ltx23:v14 --format 'Entrypoint={{json .Config.Entrypoint}}'
          docker image inspect antilopax/ltx23:v14 --format 'Cmd={{json .Config.Cmd}}'
          docker image inspect antilopax/ltx23:v14 --format 'WorkingDir={{json .Config.WorkingDir}}'
          docker image inspect antilopax/ltx23:v14 --format 'Env={{json .Config.Env}}'
          docker image inspect antilopax/ltx23:v14 --format 'ExposedPorts={{json .Config.ExposedPorts}}'
          docker image inspect antilopax/ltx23:v14 --format 'User={{json .Config.User}}'

      - name: Inspect likely ComfyUI and startup paths
        run: |
          docker run --rm --entrypoint /bin/bash antilopax/ltx23:v14 -lc '
            set +e
            echo "=== root ==="
            ls -la /
            echo "=== workspace ==="
            ls -la /workspace 2>/dev/null || true
            echo "=== comfy candidates ==="
            find / -maxdepth 4 -type d \( -iname "ComfyUI" -o -iname "*comfy*" \) 2>/dev/null | head -80
            echo "=== startup candidates ==="
            find / -maxdepth 4 -type f \( -name "main.py" -o -name "*entrypoint*" -o -name "*start*.sh" -o -name "*download*.sh" \) 2>/dev/null | head -120
            echo "=== python ==="
            python3 --version 2>/dev/null || python --version 2>/dev/null || true
          '
